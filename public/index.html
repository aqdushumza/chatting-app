<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chatting app</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
        integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600&family=Josefin+Sans:wght@700&family=Kanit:wght@500&family=Lilita+One&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Oswald:wght@500&display=swap">
</head>

<body>
    <h1 class="title">ichat</h1>
    <div class="main">
        <div class="name">
            <span><i class="far fa-user"></i></span>
            <input type="text" class="name-input" id="name-input" value="anonymous" maxlength="20">
        </div>
        <ul class="message-container" id="message-container">
            <li class="message-right">
                <p class="message"></p>
                <span></span>
            </li>
            <li class="message-left">
                <p class="message"></p>
                <span></span>
            </li>
            <li class="message-feedback">
                <p class="feedback" id="feedback"></p>
            </li>
        </ul>
        <form class="message-form" id="message-form">
            <input type="text" id="message-input" class="message-input" name="message">
            <div class="v-divider">
                <button type="submit" class="send-button">send <span><i class="fas fa-paper-plane"></i></span></button>
            </div>
        </form>
    </div>
    <h3 class="clients-total" id="clients-total">total clients are : 8</h3>
</body>
<script src="socket.io/socket.io.js"></script>
<script src="main.js"></script>
<script
  src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"
  crossorigin="anonymous">
</script>
</html>
